---
- hosts: all
  any_errors_fatal: true
  gather_facts: true

  tasks:
    - name: Ping host via WinRM
      ansible.windows.win_ping:

    - name: Prevent Windows User Profile Service from unloading HKCU registry hive
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
        name: DisableForceUnload
        data: 1
        type: dword
        state: present

    - name: Run Windows Security and Critical Updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        reboot: true
        reboot_timeout: 3600
      register: win_updates
      until: win_updates is succeeded
      retries: 3
      delay: 60

    - name: Ensure Windows Update service is set to manual
      ansible.windows.win_service:
        name: wuauserv
        start_mode: manual
        state: stopped